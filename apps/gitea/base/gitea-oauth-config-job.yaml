# Gitea OAuth Configuration Job
# Uses kubectl exec to run Gitea CLI inside the Gitea pod
# This is required because Gitea does NOT expose /api/v1/admin/auth endpoint
# Auth sources can ONLY be managed via Web UI or CLI (gitea admin auth add-oauth)
# Reference: https://docs.gitea.com/administration/command-line#admin
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-oauth-config
  namespace: gitea
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "5"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: gitea-oauth-config
    spec:
      serviceAccountName: gitea-oauth-config
      restartPolicy: OnFailure
      containers:
        - name: config
          image: alpine/k8s:1.28.3
          env:
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gitea-oidc-credentials
                  key: client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitea-oidc-credentials
                  key: client-secret
            - name: KEYCLOAK_BASE_URL
              value: "https://keycloak.${DOMAIN}"
            - name: KEYCLOAK_REALM
              value: "k8tre-app"
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "=== Gitea OAuth Config Job (CLI Method) ==="
              echo "KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}"
              echo "KEYCLOAK_REALM: ${KEYCLOAK_REALM}"
              echo "OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}"
              echo ""

              # Wait for Gitea pod to be ready
              echo "Waiting for Gitea pod..."
              for i in $(seq 1 60); do
                POD_NAME=$(kubectl get pods -n gitea -l app.kubernetes.io/name=gitea \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
                if [ -n "$POD_NAME" ]; then
                  POD_READY=$(kubectl get pod -n gitea "$POD_NAME" \
                    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
                  if [ "$POD_READY" = "True" ]; then
                    echo "✓ Gitea pod $POD_NAME is ready"
                    break
                  fi
                fi
                echo "  Waiting for Gitea pod... ($i/60)"
                sleep 5
              done

              if [ -z "$POD_NAME" ] || [ "$POD_READY" != "True" ]; then
                echo "✗ Gitea pod not ready after 5 minutes"
                exit 1
              fi

              DISCOVERY_URL="${KEYCLOAK_BASE_URL}/realms/${KEYCLOAK_REALM}/.well-known/openid-configuration"

              # Wait for Keycloak OIDC endpoint
              echo ""
              echo "Waiting for Keycloak OIDC endpoint..."
              for i in $(seq 1 60); do
                if curl -fsSk "${DISCOVERY_URL}" >/dev/null 2>&1; then
                  echo "✓ Keycloak OIDC endpoint is ready"
                  break
                fi
                echo "  Waiting for Keycloak... ($i/60)"
                sleep 5
              done

              if ! curl -fsSk "${DISCOVERY_URL}" >/dev/null 2>&1; then
                echo "Keycloak OIDC endpoint not ready"
                exit 1
              fi

              # Check if auth source already exists using Gitea CLI
              echo ""
              echo "Checking existing auth sources..."
              AUTH_LIST=$(kubectl exec -n gitea "$POD_NAME" -c gitea -- \
                gitea admin auth list 2>/dev/null || echo "")
              
              if echo "$AUTH_LIST" | grep -qi "keycloak"; then
                echo "✓ Keycloak OAuth source already exists"
                echo "$AUTH_LIST"
                exit 0
              fi

              # Create OAuth source using Gitea CLI
              # Reference: https://docs.gitea.com/administration/command-line#admin
              echo ""
              echo "Creating Keycloak OAuth2 source via Gitea CLI..."
              kubectl exec -n gitea "$POD_NAME" -c gitea -- \
                gitea admin auth add-oauth \
                  --name "keycloak" \
                  --provider "openidConnect" \
                  --key "${OIDC_CLIENT_ID}" \
                  --secret "${OIDC_CLIENT_SECRET}" \
                  --auto-discover-url "${DISCOVERY_URL}" \
                  --scopes "openid,profile,email,groups" \
                  --group-claim-name "groups"

              echo ""
              echo "✓ OAuth2 source created successfully!"
              
              # Verify creation
              echo ""
              echo "Verifying auth source..."
              kubectl exec -n gitea "$POD_NAME" -c gitea -- gitea admin auth list
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-oauth-config
  namespace: gitea
---
# RBAC for kubectl exec into Gitea pod
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-oauth-config
  namespace: gitea
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-oauth-config
  namespace: gitea
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-oauth-config
subjects:
  - kind: ServiceAccount
    name: gitea-oauth-config
    namespace: gitea
