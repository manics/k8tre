apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-secrets
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: gitea-secret
    template:
      type: Opaque
  data:
    - secretKey: username
      remoteRef:
        key: gitea-secrets                 # <-- AKV object name
        property: admin-username           # <-- property inside that object
    - secretKey: password
      remoteRef:
        key: gitea-secrets
        property: admin-password
---
# Gitea OIDC credentials for Keycloak SSO (keys match the chart's gitea.oauth existingSecret)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-oidc-credentials
  namespace: gitea
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: gitea-oidc-credentials
    template:
      type: Opaque
  data:
    - secretKey: key
      remoteRef:
        key: gitea-oidc-client
        property: client-id
    - secretKey: secret
      remoteRef:
        key: gitea-oidc-client
        property: client-secret
